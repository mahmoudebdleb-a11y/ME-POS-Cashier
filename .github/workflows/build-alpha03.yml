name: Build ME POS Cashier Fresh 28 Cloud

on:
  push:
    branches: [ main, 'fix/cashier-sale-items-20261017' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cashier-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Reassemble verified Alpha 03 baseline
        shell: bash
        run: |
          cat alpha03.parts/part01.b64 alpha03.parts/part02.b64 alpha03.parts/part03.b64 alpha03.parts/part04a.b64 alpha03.parts/part04b.b64 | tr -d '[:space:]' > /tmp/alpha03.b64
          test "$(wc -c < /tmp/alpha03.b64)" -eq 25628
          base64 --decode /tmp/alpha03.b64 > /tmp/ME-POS-Cashier-alpha03.zip
          echo "ac19f23f8a3ef4357ca6b552b05b6724c6fedfe876d1b7917c93f8c95c9d241e  /tmp/ME-POS-Cashier-alpha03.zip" | sha256sum -c -
          rm -rf build-src
          mkdir -p build-src
          unzip -q /tmp/ME-POS-Cashier-alpha03.zip -d build-src
          test -f build-src/settings.gradle
          test -f build-src/app/build.gradle

      - name: Apply stock-safety patch
        shell: bash
        run: |
          cd build-src
          patch -p1 < ../patches/alpha04.patch

      - name: Apply proven SUNMI printer baseline
        shell: bash
        run: |
          python3 patches/client_hotfix_104.py
          grep -q "SunmiPrinter" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java

      - name: Apply proven SUNMI T2s drawer integration
        shell: bash
        run: |
          python3 patches/drawer_hotfix_105.py
          grep -q "s.openDrawer(null)" build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java

      - name: Apply full client scope 1.0.6
        shell: bash
        run: |
          python3 patches/full_scope_106.py
          grep -q "1.0.6-client-full" build-src/app/build.gradle
          grep -q "owner_pin_hash" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          grep -q "لم تتم الطباعة" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          grep -q "image_uri" build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          grep -q "printReceipt" build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java
          grep -q "s.openDrawer(null)" build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java

      - name: Download and bundle 29 product images
        shell: bash
        run: |
          set -euo pipefail
          D=build-src/app/src/main/res/drawable-nodpi
          mkdir -p "$D"
          coffee1='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=480&h=320&q=80'
          coffee2='https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=480&h=320&q=80'
          coffee3='https://images.unsplash.com/photo-1512568400610-62da28bc8a13?auto=format&fit=crop&w=480&h=320&q=80'
          coffee4='https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=480&h=320&q=80'
          coffee5='https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=480&h=320&q=80'
          drink1='https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=480&h=320&q=80'
          drink2='https://images.unsplash.com/photo-1497534446932-c925b458314e?auto=format&fit=crop&w=480&h=320&q=80'
          drink3='https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=480&h=320&q=80'
          dessert1='https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=480&h=320&q=80'
          dessert2='https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=480&h=320&q=80'
          dessert3='https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=480&h=320&q=80'
          dessert4='https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=480&h=320&q=80'
          dl(){
            id="$1"; url="$2"; fallback="$3"
            echo "Bundling ${id}"
            if ! curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 "$url" -o "$D/prod_${id}.jpg"; then
              curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 "$fallback" -o "$D/prod_${id}.jpg"
            fi
            test "$(wc -c < "$D/prod_${id}.jpg")" -gt 4000
          }
          dl hot_today "$coffee1" "$coffee2"
          dl cortado "$coffee2" "$coffee1"
          dl turkish "$coffee3" "$coffee1"
          dl espresso "$coffee4" "$coffee2"
          dl flat_white "$coffee5" "$coffee1"
          dl americano_hot "$coffee1" "$coffee3"
          dl cappuccino "$coffee2" "$coffee5"
          dl latte_client "$coffee5" "$coffee2"
          dl hot_chocolate "$coffee3" "$coffee2"
          dl v60 "$coffee4" "$coffee1"
          dl cold_today "$drink1" "$coffee1"
          dl hibiscus_small "$drink2" "$drink1"
          dl hibiscus_large "$drink3" "$drink2"
          dl spanish_latte "$coffee5" "$drink1"
          dl caramel_latte "$coffee2" "$coffee5"
          dl ice_latte "$coffee5" "$drink1"
          dl ice_americano "$coffee1" "$drink1"
          dl matcha_white_mocha "$drink1" "$coffee5"
          dl mojito_mix "$drink3" "$drink2"
          dl tea_client "$drink2" "$coffee1"
          dl tiramisu_blueberry "$dessert4" "$dessert1"
          dl tiramisu_classic "$dessert1" "$dessert3"
          dl tiramisu_coconut "$dessert3" "$dessert1"
          dl donuts_cake "$dessert2" "$dessert1"
          dl cho_keez "$dessert1" "$dessert3"
          dl pancake "$dessert3" "$dessert1"
          dl waffle "$dessert2" "$dessert3"
          dl kunafa_cream "$dessert1" "$dessert3"
          dl kunafa_chocolate "$dessert3" "$dessert1"
          test "$(find "$D" -maxdepth 1 -name 'prod_*.jpg' | wc -l)" -eq 29

      - name: Link bundled images to products and bump 1.0.7
        shell: bash
        run: |
          python3 patches/bundled_images_107.py
          grep -q "1.0.7-client-images" build-src/app/build.gradle
          grep -q "android.resource://com.mahmoud.meposcashier/drawable/prod_" build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          test "$(find build-src/app/src/main/res/drawable-nodpi -maxdepth 1 -name 'prod_*.jpg' | wc -l)" -eq 29

      - name: Fix nine-column sale_items checkout insert
        shell: bash
        run: |
          python3 patches/fix_sale_items_108.py
          grep -q 'INSERT INTO sale_items(id,sale_id,product_id,product_name,qty,unit_price_minor,line_total_minor)' build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java

      - name: Apply clean official 28-product catalog
        shell: bash
        run: |
          python3 patches/official_fresh_109.py
          grep -q 'importOfficialFresh(db);' build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          test "$(python3 -c 'import json; print(len(json.load(open("build-src/app/src/main/assets/catalog_official_fresh.json"))))')" -eq 28

      - name: Regression test - checkout sale_items SQL against nine-column database
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sqlite3
          from pathlib import Path

          source = Path("build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java").read_text(encoding="utf-8")
          sql = ("INSERT INTO sale_items(id,sale_id,product_id,product_name,qty,unit_price_minor,line_total_minor)"
                 " VALUES(?,?,?,?,?,?,?)")
          if sql not in source:
              raise SystemExit("FAIL: explicit-column checkout insert not found")
          con = sqlite3.connect(":memory:")
          con.execute("""
              CREATE TABLE sale_items(
                  id TEXT PRIMARY KEY,
                  sale_id TEXT NOT NULL,
                  product_id TEXT NOT NULL,
                  product_name TEXT NOT NULL,
                  qty INTEGER NOT NULL,
                  unit_price_minor INTEGER NOT NULL,
                  line_total_minor INTEGER NOT NULL,
                  printed INTEGER NOT NULL DEFAULT 0,
                  visible INTEGER NOT NULL DEFAULT 1
              )
          """)
          con.execute(sql, ("item1", "sale1", "product1", "Coffee", 2, 1500, 3000))
          row = con.execute("SELECT qty, line_total_minor, printed, visible FROM sale_items WHERE id='item1'").fetchone()
          assert row == (2, 3000, 0, 1), row
          print("PASS: checkout insert persists seven supplied values and two database defaults")
          PY

      - name: Unit tests
        working-directory: build-src
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s build-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/app/build/outputs/apk/debug/app-debug.apk
          test "$(unzip -l build-src/app/build/outputs/apk/debug/app-debug.apk | grep -c 'prod_.*\.jpg')" -ge 29

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-POS-Cashier-fresh28-cloud-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload cloud build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cashier-cloud-build-diagnostics
          path: |
            build-src/app/build/reports/**
            build-src/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  android-emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download tested debug APK
        uses: actions/download-artifact@v4
        with:
          name: ME-POS-Cashier-fresh28-cloud-debug
          path: apk

      - name: Boot Android emulator and smoke-test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: >-
            adb wait-for-device &&
            adb shell getprop sys.boot_completed &&
            adb install -r apk/app-debug.apk &&
            adb logcat -c &&
            adb shell monkey -p com.mahmoud.meposcashier -c android.intent.category.LAUNCHER 1 &&
            sleep 12 &&
            adb shell pidof com.mahmoud.meposcashier &&
            adb shell screencap -p /sdcard/cashier-smoke.png &&
            adb pull /sdcard/cashier-smoke.png cashier-smoke.png &&
            echo 'PASS: APK installed and cashier process running on Android 9 emulator'

      - name: Collect emulator crash logs
        if: always()
        shell: bash
        run: |
          adb logcat -d -v time > cashier-emulator-logcat.txt || true
          grep -Ei 'FATAL EXCEPTION|SQLiteException|AndroidRuntime|sale_items' cashier-emulator-logcat.txt > cashier-crash-extract.txt || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashier-android9-logcat
          retention-days: 14
          path: |
            cashier-emulator-logcat.txt
            cashier-crash-extract.txt
          if-no-files-found: ignore

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashier-android9-smoke-screenshot
          retention-days: 14
          path: cashier-smoke.png
          if-no-files-found: ignore
