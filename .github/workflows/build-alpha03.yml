name: Build ME POS Cashier 1.0.7 Full Client Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble verified Alpha 03 baseline
        shell: bash
        run: |
          cat alpha03.parts/part01.b64 alpha03.parts/part02.b64 alpha03.parts/part03.b64 alpha03.parts/part04a.b64 alpha03.parts/part04b.b64 | tr -d '[:space:]' > /tmp/alpha03.b64
          test "$(wc -c < /tmp/alpha03.b64)" -eq 25628
          base64 --decode /tmp/alpha03.b64 > /tmp/ME-POS-Cashier-alpha03.zip
          echo "ac19f23f8a3ef4357ca6b552b05b6724c6fedfe876d1b7917c93f8c95c9d241e  /tmp/ME-POS-Cashier-alpha03.zip" | sha256sum -c -
          rm -rf build-src
          mkdir -p build-src
          unzip -q /tmp/ME-POS-Cashier-alpha03.zip -d build-src
          test -f build-src/settings.gradle
          test -f build-src/app/build.gradle

      - name: Apply stock-safety patch
        shell: bash
        run: |
          cd build-src
          patch -p1 < ../patches/alpha04.patch

      - name: Apply proven SUNMI printer baseline
        shell: bash
        run: |
          python3 patches/client_hotfix_104.py
          grep -q "SunmiPrinter" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java

      - name: Apply proven SUNMI T2s drawer integration
        shell: bash
        run: |
          python3 patches/drawer_hotfix_105.py
          grep -q "s.openDrawer(null)" build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java

      - name: Apply full client scope 1.0.6
        shell: bash
        run: |
          python3 patches/full_scope_106.py
          grep -q "1.0.6-client-full" build-src/app/build.gradle
          grep -q "owner_pin_hash" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          grep -q "لم تتم الطباعة" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          grep -q "image_uri" build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          grep -q "printReceipt" build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java
          grep -q "s.openDrawer(null)" build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java
          grep -q 's.printText(text+"\\n",null)' build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java

      - name: Download and bundle 29 product images
        shell: bash
        run: |
          set -euo pipefail
          D=build-src/app/src/main/res/drawable-nodpi
          mkdir -p "$D"
          dl(){
            id="$1"; tags="$2"; lock="$3"
            url="https://loremflickr.com/480/320/${tags}?lock=${lock}"
            echo "Bundling ${id} <- ${tags}"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 90 "$url" -o "$D/prod_${id}.jpg"
            test "$(wc -c < "$D/prod_${id}.jpg")" -gt 4000
          }
          dl hot_today coffee 101
          dl cortado cortado,coffee 102
          dl turkish turkish,coffee 103
          dl espresso espresso,coffee 104
          dl flat_white flatwhite,coffee 105
          dl americano_hot americano,coffee 106
          dl cappuccino cappuccino,coffee 107
          dl latte_client latte,coffee 108
          dl hot_chocolate hotchocolate,drink 109
          dl v60 pourover,coffee 110
          dl cold_today icedcoffee 201
          dl hibiscus_small hibiscus,drink 202
          dl hibiscus_large hibiscus,juice 203
          dl spanish_latte icedlatte,coffee 204
          dl caramel_latte caramel,icedcoffee 205
          dl ice_latte icedlatte 206
          dl ice_americano icedamericano,coffee 207
          dl matcha_white_mocha matcha,drink 208
          dl mojito_mix mojito,berry 209
          dl tea_client tea,hotdrink 210
          dl tiramisu_blueberry tiramisu,blueberry 301
          dl tiramisu_classic tiramisu,dessert 302
          dl tiramisu_coconut tiramisu,coconut 303
          dl donuts_cake donut,cake 304
          dl cho_keez cheesecake,dessert 305
          dl pancake pancake,chocolate 306
          dl waffle waffle,chocolate 307
          dl kunafa_cream kunafa,dessert 308
          dl kunafa_chocolate chocolate,dessert 309
          test "$(find "$D" -maxdepth 1 -name 'prod_*.jpg' | wc -l)" -eq 29

      - name: Link bundled images to products and bump 1.0.7
        shell: bash
        run: |
          python3 patches/bundled_images_107.py
          grep -q "1.0.7-client-images" build-src/app/build.gradle
          grep -q "android.resource://com.mahmoud.meposcashier/drawable/prod_" build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          test "$(find build-src/app/src/main/res/drawable-nodpi -maxdepth 1 -name 'prod_*.jpg' | wc -l)" -eq 29

      - name: Unit tests
        working-directory: build-src
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s build-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/app/build/outputs/apk/debug/app-debug.apk
          unzip -l build-src/app/build/outputs/apk/debug/app-debug.apk | grep -q 'res/drawable-nodpi/prod_'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-POS-Cashier-1.0.7-full-client-images-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
