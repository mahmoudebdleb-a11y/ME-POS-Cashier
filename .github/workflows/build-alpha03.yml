name: Build ME POS Cashier Alpha 03

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Alpha 03 source
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src
          base64 --decode ME-POS-Cashier-alpha03.zip.b64 > /tmp/ME-POS-Cashier-alpha03.zip
          unzip -q /tmp/ME-POS-Cashier-alpha03.zip -d build-src
          test -f build-src/settings.gradle
          test -f build-src/app/build.gradle

      - name: Unit tests
        working-directory: build-src
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: me-pos-cashier-alpha03-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
