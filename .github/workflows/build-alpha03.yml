name: Build ME POS Cashier 1.0.4 Client Hotfix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble verified Alpha 03 baseline
        shell: bash
        run: |
          cat alpha03.parts/part01.b64 alpha03.parts/part02.b64 alpha03.parts/part03.b64 alpha03.parts/part04a.b64 alpha03.parts/part04b.b64 | tr -d '[:space:]' > /tmp/alpha03.b64
          test "$(wc -c < /tmp/alpha03.b64)" -eq 25628
          base64 --decode /tmp/alpha03.b64 > /tmp/ME-POS-Cashier-alpha03.zip
          echo "ac19f23f8a3ef4357ca6b552b05b6724c6fedfe876d1b7917c93f8c95c9d241e  /tmp/ME-POS-Cashier-alpha03.zip" | sha256sum -c -
          rm -rf build-src
          mkdir -p build-src
          unzip -q /tmp/ME-POS-Cashier-alpha03.zip -d build-src
          test -f build-src/settings.gradle
          test -f build-src/app/build.gradle

      - name: Apply stock-safety patch
        shell: bash
        run: |
          cd build-src
          patch -p1 < ../patches/alpha04.patch

      - name: Apply urgent client 1.0.4 hotfix
        shell: bash
        run: |
          python3 patches/client_hotfix_104.py
          grep -q "1.0.4-client" build-src/app/build.gradle
          grep -q "taxBps=0" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          grep -q "دفع شبكة" build-src/app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          grep -q "تراميسو توت أزرق" build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          test -f build-src/app/src/main/java/com/mahmoud/meposcashier/SunmiPrinter.java

      - name: Unit tests
        working-directory: build-src
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s build-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-POS-Cashier-1.0.4-client-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
