name: Build ME POS Cashier 1.0.8 Play Release AAB

on:
  push:
    branches: [ play-release-prep-1.0.8 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble verified Alpha 03 baseline
        shell: bash
        run: |
          cat alpha03.parts/part01.b64 alpha03.parts/part02.b64 alpha03.parts/part03.b64 alpha03.parts/part04a.b64 alpha03.parts/part04b.b64 | tr -d '[:space:]' > /tmp/alpha03.b64
          test "$(wc -c < /tmp/alpha03.b64)" -eq 25628
          base64 --decode /tmp/alpha03.b64 > /tmp/ME-POS-Cashier-alpha03.zip
          echo "ac19f23f8a3ef4357ca6b552b05b6724c6fedfe876d1b7917c93f8c95c9d241e  /tmp/ME-POS-Cashier-alpha03.zip" | sha256sum -c -
          rm -rf build-src
          mkdir -p build-src
          unzip -q /tmp/ME-POS-Cashier-alpha03.zip -d build-src

      - name: Apply stock-safety patch
        shell: bash
        run: |
          cd build-src
          patch -p1 < ../patches/alpha04.patch

      - name: Apply proven SUNMI printer baseline
        run: python3 patches/client_hotfix_104.py

      - name: Apply proven SUNMI T2s drawer integration
        run: python3 patches/drawer_hotfix_105.py

      - name: Apply full client scope 1.0.6
        run: python3 patches/full_scope_106.py

      - name: Download and bundle 29 product images
        shell: bash
        run: |
          set -euo pipefail
          D=build-src/app/src/main/res/drawable-nodpi
          mkdir -p "$D"
          coffee1='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=480&h=320&q=80'
          coffee2='https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=480&h=320&q=80'
          coffee3='https://images.unsplash.com/photo-1512568400610-62da28bc8a13?auto=format&fit=crop&w=480&h=320&q=80'
          coffee4='https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=480&h=320&q=80'
          coffee5='https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=480&h=320&q=80'
          drink1='https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=480&h=320&q=80'
          drink2='https://images.unsplash.com/photo-1497534446932-c925b458314e?auto=format&fit=crop&w=480&h=320&q=80'
          drink3='https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=480&h=320&q=80'
          dessert1='https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=480&h=320&q=80'
          dessert2='https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=480&h=320&q=80'
          dessert3='https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=480&h=320&q=80'
          dessert4='https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=480&h=320&q=80'
          dl(){
            id="$1"; url="$2"; fallback="$3"
            if ! curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 "$url" -o "$D/prod_${id}.jpg"; then
              curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 "$fallback" -o "$D/prod_${id}.jpg"
            fi
            test "$(wc -c < "$D/prod_${id}.jpg")" -gt 4000
          }
          dl hot_today "$coffee1" "$coffee2"
          dl cortado "$coffee2" "$coffee1"
          dl turkish "$coffee3" "$coffee1"
          dl espresso "$coffee4" "$coffee2"
          dl flat_white "$coffee5" "$coffee1"
          dl americano_hot "$coffee1" "$coffee3"
          dl cappuccino "$coffee2" "$coffee5"
          dl latte_client "$coffee5" "$coffee2"
          dl hot_chocolate "$coffee3" "$coffee2"
          dl v60 "$coffee4" "$coffee1"
          dl cold_today "$drink1" "$coffee1"
          dl hibiscus_small "$drink2" "$drink1"
          dl hibiscus_large "$drink3" "$drink2"
          dl spanish_latte "$coffee5" "$drink1"
          dl caramel_latte "$coffee2" "$coffee5"
          dl ice_latte "$coffee5" "$drink1"
          dl ice_americano "$coffee1" "$drink1"
          dl matcha_white_mocha "$drink1" "$coffee5"
          dl mojito_mix "$drink3" "$drink2"
          dl tea_client "$drink2" "$coffee1"
          dl tiramisu_blueberry "$dessert4" "$dessert1"
          dl tiramisu_classic "$dessert1" "$dessert3"
          dl tiramisu_coconut "$dessert3" "$dessert1"
          dl donuts_cake "$dessert2" "$dessert1"
          dl cho_keez "$dessert1" "$dessert3"
          dl pancake "$dessert3" "$dessert1"
          dl waffle "$dessert2" "$dessert3"
          dl kunafa_cream "$dessert1" "$dessert3"
          dl kunafa_chocolate "$dessert3" "$dessert1"
          test "$(find "$D" -maxdepth 1 -name 'prod_*.jpg' | wc -l)" -eq 29

      - name: Link bundled images 1.0.7
        run: python3 patches/bundled_images_107.py

      - name: Prepare Play version 1.0.8
        shell: bash
        run: |
          python3 patches/play_release_108.py
          grep -q "versionCode 108" build-src/app/build.gradle
          grep -q "1.0.8-play-release" build-src/app/build.gradle
          grep -q "android.resource://com.mahmoud.meposcashier/drawable/prod_" build-src/app/src/main/java/com/mahmoud/meposcashier/PosDb.java

      - name: Unit tests
        working-directory: build-src
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release AAB
        working-directory: build-src
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify release AAB
        shell: bash
        run: |
          AAB=build-src/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          sha256sum "$AAB"
          test "$(unzip -l "$AAB" | grep -c 'prod_.*\.jpg')" -ge 29

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ME-POS-Cashier-1.0.8-play-release-unsigned-aab
          path: build-src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
