name: Inspect ME POS Cashier source

on:
  push:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        shell: bash
        run: |
          cat alpha03.parts/part01.b64 alpha03.parts/part02.b64 alpha03.parts/part03.b64 alpha03.parts/part04a.b64 alpha03.parts/part04b.b64 | tr -d '[:space:]' > /tmp/alpha03.b64
          base64 --decode /tmp/alpha03.b64 > /tmp/src.zip
          rm -rf build-src && mkdir build-src && unzip -q /tmp/src.zip -d build-src
          cd build-src
          patch -p1 < ../patches/alpha04.patch
          echo '=== ROOT BUILD ==='; cat build.gradle
          echo '=== SETTINGS ==='; cat settings.gradle
          echo '=== APP BUILD ==='; cat app/build.gradle
          echo '=== MAIN ACTIVITY ==='; sed -n '1,420p' app/src/main/java/com/mahmoud/meposcashier/MainActivity.java
          echo '=== POSDB ==='; sed -n '1,320p' app/src/main/java/com/mahmoud/meposcashier/PosDb.java
          echo '=== THERMAL PRINTER ==='; cat app/src/main/java/com/mahmoud/meposcashier/ThermalPrinter.java
